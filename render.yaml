services:
  - type: web
    name: delivery24-api
    runtime: node
    plan: free
    nodeVersion: 20
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEMO_MODE
        value: "true"
      - key: SUPERADMIN_PHONE
        value: "9949808388"
      - key: CORS_ORIGIN
        value: "*"
